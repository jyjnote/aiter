<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>Streaming TTS (Hybrid + Perf Log)</title>
  
  <style>
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, 'Noto Sans KR', sans-serif;
      background-color: #f4f7f6;
      color: #333;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 800px;
      margin: 20px auto;
      padding: 2rem;
      background-color: #ffffff;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.05);
    }
    h1 {
      text-align: center;
      color: #2c3e50;
    }
    p {
      text-align: center;
      color: #555;
      margin-bottom: 2rem;
    }
    textarea {
      width: 100%;
      height: 100px;
      padding: 1rem;
      font-size: 1rem;
      border: 1px solid #dfe6e9;
      border-radius: 8px;
      box-sizing: border-box;
      resize: vertical;
      margin-bottom: 1rem;
    }
    textarea:focus {
      outline: none;
      border-color: #007bff;
      box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.15);
    }
    .fake-player-container {
      margin-top: 1.5rem;
      margin-bottom: 1.5rem;
      padding: 1.5rem;
      border: 1px dashed #6c757d; 
      background-color: #f8f9fa;
      border-radius: 8px;
    }
    .fake-player-container h3 {
      margin-top: 0;
      color: #6c757d;
      font-style: italic;
    }
    .fake-progress-bar {
      width: 100%;
      height: 10px;
      background-color: #e9ecef;
      border-radius: 5px;
      overflow: hidden;
      margin-top: 1rem;
    }
    .fake-progress-fill {
      height: 100%;
      background-color: #007bff;
      transition: width 0.2s linear;
      border-radius: 5px;
    }
    .duration-text {
      display: block;
      text-align: right;
      font-size: 0.9rem;
      color: #6c757d;
      margin-top: 0.5rem;
    }
    .results-container {
      margin-top: 2rem;
      border-top: 1px solid #eee;
      padding-top: 1.5rem;
    }
    .results-container h3 {
      color: #343a40;
    }
    .sentence-item {
      padding: 1rem;
      background-color: #fdfdfd;
      border: 1px solid #eee;
      border-radius: 8px;
      margin-bottom: 1rem;
    }
    .sentence-item.current {
      border: 1px solid #007bff;
      background-color: #f8f9fa;
      box-shadow: 0 2px 4px rgba(0, 123, 255, 0.1);
    }
    .sentence-text {
      font-size: 1.1rem;
      color: #212529;
      line-height: 1.6;
      text-align: left;
      margin-top: 0;
      margin-bottom: 0.5rem;
    }
    audio {
      width: 100%;
      margin-top: 0.5rem;
    }
    .log-container {
      margin-top: 2rem;
      border-top: 1px solid #eee;
      padding-top: 1.5rem;
    }
    .log-container h3 { color: #6c757d; }
    .log-container pre {
      background-color: #282c34;
      color: #abb2bf;
      padding: 1rem;
      border-radius: 8px;
      max-height: 300px;
      overflow-y: auto;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.9rem;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Streaming TTS (No-Save Strategy + Perf Log)</h1>
    <p>실시간으로 음성이 재생되며, 문장 끝에서 플레이어가 생성됩니다.</p>
    
    <textarea id="ta" placeholder="여기에 문장을 입력하세요."></textarea>
    
    <audio id="player" style="display: none;"></audio>

    <div id="fake-player-container" class="fake-player-container" style="display: none;">
      <h3>실시간 생성 중...</h3>
      <p id="fake-player-text" class="sentence-text">""</p>
      <div class="fake-progress-bar">
        <div id="fake-progress-fill" class="fake-progress-fill" style="width: 0;"></div>
      </div>
      <span id="fake-duration-text" class="duration-text">0.00 초</span>
    </div>

    <div id="results-container" class="results-container">
      <h3>문장 기록</h3>
    </div>

    <div class="log-container">
      <h3>상태 로그</h3>
      <pre id="log"></pre>
    </div>
  </div>

<script>
(function() {
  const sid = crypto.randomUUID();
  const ta = document.getElementById('ta');
  const log = document.getElementById('log');
  const player = document.getElementById('player');
  
  const fakePlayerContainer = document.getElementById('fake-player-container');
  const fakePlayerText = document.getElementById('fake-player-text');
  const fakeProgressFill = document.getElementById('fake-progress-fill');
  const fakeDurationText = document.getElementById('fake-duration-text');
  
  const resultsContainer = document.getElementById('results-container');

  const audioContext = new (window.AudioContext || window.webkitAudioContext)();
  let streamingDuration = 0; 

  // [PERF] 타이머 변수 추가
  let lastPlaybackEndTime = null; // 오디오 재생이 끝난 시간
  // [수정] lastChunkArrivalTime 변수 제거

  function addLog(message) {
    console.log(message);
    log.textContent = `[${new Date().toLocaleTimeString()}] ${message}\n` + log.textContent;
  }

  const q = [];
  let playing = false;
  
  // Base64 데이터를 받아 Blob URL로 변환하고 재생 큐에 추가하는 함수
  function b64ToBlobUrl(b64) {
    try {
      const byteChars = atob(b64);
      const byteNums = new Array(byteChars.length);
      for (let i = 0; i < byteChars.length; i++) byteNums[i] = byteChars.charCodeAt(i);
      const byteArray = new Uint8Array(byteNums);
      const blob = new Blob([byteArray], { type: 'audio/wav' });
      return URL.createObjectURL(blob);
    } catch (error) {
      addLog(`[AUDIO] Base64 디코딩 오류: ${error}`);
      return null;
    }
  }

  function playStreamingChunk(b64) {
    if (!audioContext) return;
    
    const url = b64ToBlobUrl(b64);
    if (!url) return; // 디코딩 실패
    
    q.push(url);
    if (!playing) playNext();

    // 가짜 프로그레스 바 업데이트 로직 (선택 사항)
    try {
      const byteChars = atob(b64);
      const byteNums = new Array(byteChars.length);
      for (let i = 0; i < byteChars.length; i++) byteNums[i] = byteChars.charCodeAt(i);
      const byteArray = new Uint8Array(byteNums);
      const bufferToDecode = byteArray.buffer.slice(0);
      
      audioContext.decodeAudioData(bufferToDecode, (audioBuffer) => {
        streamingDuration += audioBuffer.duration;
        fakeProgressFill.style.width = `${streamingDuration * 20}px`; 
        fakeDurationText.textContent = `${streamingDuration.toFixed(2)} 초`;
      }, (err) => addLog(`[AUDIO] 청크 디코딩 오류: ${err}`));
    } catch (e) {}
  }

  function playNext() {
    if (q.length === 0) { playing = false; return; }
    playing = true;

    // [PERF] 오디오 재생 간격(Gap) 측정 (이 로그는 유지)
    if (lastPlaybackEndTime) {
      const startTime = new Date().getTime();
      const gap = (startTime - lastPlaybackEndTime) / 1000;
      addLog(`[PERF] 🏁 이전 오디오 종료 후 다음 재생까지 공백: ${gap.toFixed(3)}초`);
      lastPlaybackEndTime = null; // 다음 측정을 위해 리셋
    }

    const url = q.shift();
    player.src = url;
    player.play().catch(err => {
      addLog(`[AUDIO] 재생 오류: ${err}`);
      playing = false;
    });
  }
  
  player.onended = () => {
    const oldUrl = player.src;
    if (oldUrl.startsWith('blob:')) {
      URL.revokeObjectURL(oldUrl);
    }
    
    // [PERF] 재생 종료 시간 기록
    lastPlaybackEndTime = new Date().getTime();
    addLog(`[AUDIO] 재생 완료. (남은 큐: ${q.length})`);

    playNext();
  };

  // 'final_audio' 메시지를 처리하는 함수 (Base64 사용)
  function displayFinalAudio(msg) {
    fakePlayerContainer.style.display = 'none';
    streamingDuration = 0;
    
    const oldCurrent = document.querySelector('.sentence-item.current');
    if (oldCurrent) {
      oldCurrent.classList.remove('current');
      const oldAudio = oldCurrent.querySelector('audio');
      if (oldAudio) oldAudio.pause();
    }

    const newSentenceDiv = document.createElement('div');
    newSentenceDiv.className = 'sentence-item current'; 

    const textElement = document.createElement('p');
    textElement.className = 'sentence-text';
    textElement.textContent = `"${msg.text}"`;

    const audioElement = document.createElement('audio');
    audioElement.controls = true;
    audioElement.preload = 'auto';
    audioElement.autoplay = false; 

    if (msg.b64wav) {
        addLog(`[AUDIO] 최종 오디오 Base64 수신. Blob URL 생성 중...`);
        const url = b64ToBlobUrl(msg.b64wav);
        if (url) {
            audioElement.src = url;
            audioElement.onended = () => {
                if (audioElement.src.startsWith('blob:')) {
                    URL.revokeObjectURL(audioElement.src);
                    addLog(`[AUDIO] Blob URL 해제: ${audioElement.src}`);
                }
            };
        } else {
             textElement.textContent += " (오디오 로딩 실패)";
        }
    } else {
        addLog(`[AUDIO] 오류: 'final_audio' 메시지에 'b64wav' 필드가 없습니다.`);
    }

    newSentenceDiv.appendChild(textElement);
    newSentenceDiv.appendChild(audioElement);

    resultsContainer.prepend(newSentenceDiv);
  }

  addLog(`세션 [${sid}] 시작. SSE 연결 대기 중...`);
  const es = new EventSource("/sse_audio?sid=" + encodeURIComponent(sid)); 
  
  es.onopen = () => addLog("✅ SSE 연결 성공!");
  
  es.onmessage = (e) => {
    try {
      const msg = JSON.parse(e.data);
      
      // [PERF] 청크 도착 간격 측정 (제거됨)
      
      if (msg.type === 'streaming_audio' && msg.b64wav) {
        addLog(`[AUDIO] 스트리밍 청크 수신. 즉시 재생합니다.`);
        fakePlayerContainer.style.display = 'block';
        playStreamingChunk(msg.b64wav);
      
      } else if (msg.type === 'final_audio' && msg.b64wav) {
        addLog(`[AUDIO] 최종 오디오 수신: ${msg.text}. 즉시 재생합니다.`);
        playStreamingChunk(msg.b64wav); // 스트리밍 플레이어로 즉시 재생
        displayFinalAudio(msg); // 동시에 하단 기록에도 추가
      
      } else if (msg.type === 'log') {
        addLog(`[SERVER LOG] ${msg.msg}`);
      
      } else if (msg.type === 'end') {
        addLog("🏁 TTS 문장 작업 완료.");
        fakePlayerContainer.style.display = 'none';
        streamingDuration = 0;
      // [수정] lastChunkArrivalTime = null; 제거
      } else if (msg.type === 'stream_text') {
        addLog(`[TEXT] 스트리밍 텍스트: ${msg.text}`);
        fakePlayerText.textContent = `"${msg.text}"`;
      }

    } catch (err) {
      addLog(`[SSE] parse error: ${err}`);
    }
  };
  
  es.onerror = (err) => {
      addLog(`[SSE] 연결 오류 발생.`);
      console.error("SSE Error Event:", err);
  };

  function sendText(force=false) {
    const text = ta.value;
    
    if (force && !text) { 
        addLog("텍스트 없이 문장 전송(.) 시도. 무시함.");
        return;
    }

    fetch('/type', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ sid, text, force })
    }).catch((err) => addLog(`[API] /type 호출 실패: ${err}`));
    
    if (force) {
      ta.value = ''; // 전송 후 텍스트 영역 비우기
      q.length = 0; // 재생 큐 비우기
    }
  }

  let isComposing = false;
  const punctuationRegex = /[.,?!]$/; 
  const hasContentRegex = /[a-zA-Z0-9가-힣]/;

  ta.addEventListener('compositionstart', () => {
    addLog("[INPUT] 한글 조합 시작...");
    isComposing = true;
  });

  ta.addEventListener('compositionend', (e) => {
    isComposing = false;
    addLog("[INPUT] 한글 조합 완료.");
    handleInput(e);
  });

  function handleInput(e) {
    addLog(`[INPUT] 이벤트 발생 (Type: ${e.type}) | 조합 중: ${isComposing}`);
    
    if (isComposing) {
      return; 
    }
    
    const currentText = ta.value;
    if (!currentText) return;

    const lastChar = currentText.slice(-1);
    const prevChar = currentText.slice(-2, -1);

    if (punctuationRegex.test(currentText)) {
      if (!hasContentRegex.test(currentText)) {
          addLog("▶▶▶ 구두점만 입력: 전송 무시. 텍스트 영역을 비웁니다.");
          ta.value = '';
          return;
      } else {
          addLog("▶▶▶ 구두점 입력: 문장 전송 (force=true)");
          sendText(true);
      }
    } else if (lastChar === ' ') {
      if (prevChar === ' ' || currentText.trim() === '') {
           addLog("▶ 연속된 공백 또는 공백만 입력: 전송 무시");
           return;
      } else {
          addLog("▶ 스페이스바 입력: 단어 전송 (force=false)");
          sendText(false);
      }
    }
  }
  
  ta.addEventListener('input', handleInput);

})();
</script>
</body>
</html>
